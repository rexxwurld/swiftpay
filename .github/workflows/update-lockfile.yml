name: Update lockfile

# Run manually: Actions -> Update lockfile -> Run workflow.
# Regenerates package-lock.json so `npm ci` works again, then commits it.
# Delete this file once the lockfile is fixed.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Update package-lock.json"
          git push
