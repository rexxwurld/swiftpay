      responses:
        "200":
          description: Dispute resolved

  /admin/merchants/{id}/fees:
    patch:
      tags: [Merchant]
      summary: "Set a per-merchant platform fee override (ops-only)"
      security: [{ AdminKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                percentageBps: { type: integer, description: "Basis points, e.g. 150 = 1.5%" }
                fixedMinor: { type: integer }
                capMinor: { type: integer }
      responses:
        "200":
          description: Updated merchant fee config

  /admin/settlement/run:
    post:
      tags: [Settlement]
      summary: "Force a settlement cycle now (ops-only)"
      description: >
        Moves eligible transactions pending_settlement → settled → available
        and writes a SettlementBatch record per phase run. The real trigger
        is the scheduled job (`npm run run-settlement`); this exists so an
        operator can force a cycle out-of-band (e.g. after downtime).
      security: [{ AdminKeyAuth: [] }]
      parameters:
        - in: query
          name: currency
          schema: { type: string, default: NGN }
      responses:
        "200":
          description: Cycle result summary
        "500":
          description: Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/settlement/batches:
    get:
      tags: [Settlement]
      summary: "List recent settlement batches (ops-only)"
      security: [{ AdminKeyAuth: [] }]
      parameters:
        - in: query
          name: currency
          schema: { type: string }
        - in: query
          name: phase
          schema: { type: string, enum: [settle, make_available] }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Settlement batches
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SettlementBatch" }
        "500":
          description: Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # Merchant webhook contract:
  # The URL is owned by the merchant and registered with PATCH /merchant/webhook-url.
  # SwiftPay POSTs an envelope shaped like:
  # {
  #   "event": "transaction.success",
  #   "data": {
  #     "tx_ref": "merchant-reference",
  #     "status": "success",
  #     "amountReceived": 6800000,
  #     "currency": "NGN"
  #   },
  #   "sentAt": "2026-08-12T00:00:00.000Z"
  # }
  # Security: X-SwiftPay-Signature = HMAC-SHA512(raw_request_body, webhook_secret).
  # Verify the signature against the exact raw request body before processing.
  # Fulfillment must be idempotent; duplicate webhook deliveries must not
  # double-charge, double-credit, decrement stock twice, or increment coupons twice.
  # Acknowledge valid events with HTTP 2xx. Never expose API or webhook secrets
  # to browser/client-side code.

  /webhooks/bank:
    post:
      tags: [Webhooks]
      summary: Bank partner inbound-payment notification (not merchant-callable, HMAC-signature required)
      responses:
        "200":
          description: Accepted for async processing
