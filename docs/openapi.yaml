openapi: 3.0.3
info:
  title: SwiftPay API
  description: >
    SwiftPay - Paystack-style payment infrastructure: merchants, customers,
    dedicated virtual accounts, wallets, transactions, payouts, refunds,
    subaccounts, subscriptions and disputes. Served under a versioned
    path (/api/v1); the unversioned /api alias is kept for back-compat
    and will eventually be removed.

    Payment verification rule: never treat a browser redirect query such as
    ?status=successful as proof that a payment succeeded. The redirect is only
    a navigation signal. A merchant must verify the payment server-to-server
    with GET /payments/verify/{tx_ref}, and/or process the signed merchant
    webhook configured with PATCH /merchant/webhook-url, before fulfilling an
    order or marking it paid. Always compare the verified amountReceived with
    the order amount before fulfillment. Keep the merchant secret key on the
    server and never expose it in browser JavaScript.

    Webhook delivery is server-to-server. The merchant webhook URL is supplied
    by the merchant and is not a SwiftPay public API path. Merchants should
    verify the X-SwiftPay-Signature HMAC-SHA512 signature against the exact raw
    request body, acknowledge valid events with HTTP 2xx, and make fulfillment
    idempotent because webhook delivery may be retried.

    Test the integration in development using a test-mode checkout's
    /checkout/{token}/simulate endpoint, which stands in for a real bank
    transfer against a test-mode virtual account only.

    The merchant dashboard (/dashboard.html) is a thin client over this same
    API - every chart and stat it shows (including the Analytics tab's
    revenue and transaction-range charts) is computed in the browser from
    responses already documented here (GET /transactions, GET /payouts,
    GET /refunds, GET /disputes, GET /subscriptions). No dashboard-only
    endpoints exist; anything the dashboard can show, an API integration
    can reproduce.
  version: "2.1.0"
servers:
  - url: /api/v1
    description: Current API version
  - url: /api
    description: Deprecated alias - use /api/v1 instead

tags:
  - name: Auth
  - name: Merchant
  - name: Customers
  - name: Virtual Accounts
  - name: Checkout
  - name: Payments
  - name: Wallet
  - name: Transactions
  - name: Payouts
  - name: Refunds
  - name: Subaccounts
  - name: Recipients
  - name: Subscriptions
  - name: Disputes
  - name: Settlement
  - name: Webhooks
  - name: Admin
  - name: Admin
  - name: Mock Bank

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "sk_test_... or sk_live_..."
      description: "Merchant secret key, sent as `Authorization: Bearer sk_test_xxx`."
    AdminKeyAuth:
      type: apiKey
      in: header
      name: x-admin-key
      description: Operator-only key. Never given to merchants.

  schemas:
    Error:
      type: object
      properties:
        status: { type: boolean, example: false }
        message: { type: string, example: "invalid_api_key" }

    Wallet:
      type: object
      properties:
        _id: { type: string }
        merchant: { type: string }
        balance: { type: integer, description: "Minor units (e.g. kobo)" }
        currency: { type: string, example: NGN }

    Transaction:
      type: object
      properties:
        _id: { type: string }
        reference: { type: string }
        merchant: { type: string }
        customer: { type: string }
        amountReceived: { type: integer }
        currency: { type: string }
        status:
          type: string
          enum: [pending, success, partial, over, failed, flagged]
        platformFee: { type: integer }
        netAmount: { type: integer }

    PaymentVerificationResult:
      type: object
      description: >
        The actual shape returned by GET /payments/verify/{tx_ref}. This is a
        purpose-built result, not the full Transaction document — it has no
        _id, merchant, customer, currency, platformFee, or netAmount fields.
      properties:
        tx_ref: { type: string }
        status:
          type: string
          enum: [pending, success, partial, over, failed, flagged]
        amountExpected: { type: integer, nullable: true, description: "Minor units" }
        amountReceived: { type: integer, nullable: true, description: "Minor units" }
        accountNumber: { type: string, nullable: true }
        mode: { type: string, nullable: true, enum: [test, live] }

    Payout:
      type: object
      properties:
        _id: { type: string }
        reference: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status:
          type: string
          enum: [pending, processing, successful, failed]

    Refund:
      type: object
      properties:
        _id: { type: string }
        reference: { type: string }
        transaction: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status:
          type: string
          enum: [pending, processing, successful, failed, reversed]

    Subaccount:
      type: object
      properties:
        _id: { type: string }
        merchant: { type: string }
        subaccountCode: { type: string, example: sub_xxxxx }
        businessName: { type: string }
        settlementBankCode: { type: string }
        settlementAccountNumber: { type: string }
        settlementAccountName: { type: string }
        defaultSplitPercentage: { type: integer, nullable: true, minimum: 1, maximum: 100 }
        active: { type: boolean }
        balance:
          type: integer
          description: "Only present on GET /subaccounts/{id} — accrued ledger balance, minor units"

    Recipient:
      type: object
      properties:
        _id: { type: string }
        merchant: { type: string }
        recipientCode: { type: string, example: rcp_xxxxx }
        label: { type: string }
        bankCode: { type: string }
        accountNumber: { type: string }
        accountName: { type: string }
        active: { type: boolean }

    SettlementBatch:
      type: object
      properties:
        _id: { type: string }
        batchReference: { type: string }
        phase:
          type: string
          enum: [settle, make_available]
        currency: { type: string }
        cutoffTime: { type: string, format: date-time }
        status:
          type: string
          enum: [processing, completed, failed]
        transactionCount: { type: integer }
        totalAmount: { type: integer, description: "Minor units" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    Plan:
      type: object
      properties:
        _id: { type: string }
        planCode: { type: string }
        name: { type: string }
        amount: { type: integer }
        currency: { type: string }
        interval:
          type: string
          enum: [daily, weekly, monthly, yearly]
        intervalCount: { type: integer }

    Subscription:
      type: object
      properties:
        _id: { type: string }
        subscriptionCode: { type: string }
        plan: { type: string }
        customer: { type: string }
        status:
          type: string
          enum: [active, past_due, cancelled]
        currentPeriodStart: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }

    Invoice:
      type: object
      properties:
        _id: { type: string }
        invoiceNumber: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status:
          type: string
          enum: [pending, paid, failed, void]
        dueDate: { type: string, format: date-time }

    Dispute:
      type: object
      properties:
        _id: { type: string }
        disputeCode: { type: string }
        transaction: { type: string }
        amount: { type: integer }
        currency: { type: string }
        reason:
          type: string
          enum: [fraudulent, duplicate, product_not_received, product_unacceptable, unrecognized, other]
        status:
          type: string
          enum: [open, under_review, won, lost]
        evidenceDueBy: { type: string, format: date-time }

paths:
  /payments/initialize:
    post:
      tags: [Payments]
      summary: Hosted checkout — create the customer, assign a virtual account, and return a payment link
      description: >
        Creates a hosted checkout payment. The returned redirect URL may
        include tx_ref and a browser status value after checkout. Browser
        status values are not proof of payment. The merchant must verify the
        transaction server-to-server with GET /payments/verify/{tx_ref} and/or
        handle the signed merchant webhook before marking an order paid.
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, customer]
              properties:
                amount: { type: number, description: "Major currency units (e.g. naira for NGN, not kobo). The server multiplies by 100 internally to derive the minor-unit amount stored on the transaction." }
                customer:
                  type: object
                  properties:
                    email: { type: string }
                    name: { type: string }
                tx_ref: { type: string, description: "Optional — supply your own reference, otherwise one is generated" }
                redirect_url: { type: string, description: "Where SwiftPay redirects the customer's browser after a successful checkout (tx_ref and status query params are appended). If omitted, the checkout's /complete endpoint renders a static success page instead of redirecting." }
      responses:
        "201":
          description: Checkout link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: object
                    properties:
                      tx_ref: { type: string }
                      link: { type: string }
                      accountNumber: { type: string }
                      mode: { type: string, enum: [test, live] }

  /payments/verify/{tx_ref}:
    get:
      tags: [Payments]
      summary: Read back the transaction status for a hosted-checkout payment
      description: >
        Server-to-server verification endpoint. Use the merchant secret key
        in the Authorization header. Do not use a browser query parameter
        such as ?status=successful as payment proof. A payment may only be
        fulfilled after this endpoint reports status=success and the merchant
        confirms the verified amountReceived matches the expected order amount.
        Note this endpoint returns a purpose-built result, not the full
        Transaction object — see PaymentVerificationResult below.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: tx_ref
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/PaymentVerificationResult" }

  /checkout/{token}/status:
    get:
      tags: [Checkout]
      summary: Public, unauthenticated poll of a hosted-checkout session's status (used by pay.html)
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Checkout session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: object
                    properties:
                      accountNumber: { type: string }
                      bankName: { type: string, nullable: true }
                      amountExpected: { type: integer, description: "Minor units" }
                      mode: { type: string, enum: [test, live] }
                      paymentStatus: { type: string, enum: [pending, success, partial, over, failed, flagged] }
                      amountReceived: { type: integer, nullable: true, description: "Minor units; null until a payment lands" }
        "404":
          description: checkout_not_found
        "410":
          description: checkout_expired (only if no payment has been recorded yet)

  /checkout/{token}/complete:
    get:
      tags: [Checkout]
      summary: Public, unauthenticated — verifies a hosted-checkout session is paid and either redirects the browser or renders a static confirmation
      description: >
        Not a JSON endpoint. If the checkout was created with a redirect_url,
        a successful payment (status success or over) triggers a 303 redirect
        to that URL with tx_ref and status=successful appended as query
        params — those params are a UX signal only, never proof of payment.
        If no redirect_url was supplied, this renders a static "Payment
        successful" HTML page instead of redirecting anywhere.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the merchant's redirect_url (only when one was supplied at initialize time)
        "200":
          description: Static HTML success page (only when no redirect_url was supplied)
        "404":
          description: Checkout not found
        "409":
          description: Payment not yet confirmed, under review (flagged), or not successful
        "500":
          description: Unable to complete checkout

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, email, password]
              properties:
                businessName: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Merchant created, includes secretKey

  /auth/login:
    post:
      tags: [Auth]
      summary: Merchant login (dashboard session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Session token, or a tempToken if 2FA is enabled

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the merchant's dashboard session
      responses:
        "200": { description: Logged out }

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Second step of login when 2FA is enabled — exchanges tempToken for a full session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempToken, token]
              properties:
                tempToken: { type: string, description: "Short-lived token returned by /auth/login" }
                token: { type: string, description: "6-digit TOTP code" }
                backupCode: { type: string, description: "Alternative to token — one-time backup code" }
      responses:
        "200": { description: Session token }

  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Begin 2FA setup — returns the TOTP secret/QR data for the authenticated merchant
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200": { description: "TOTP secret and provisioning URI; 2FA not yet enabled until confirmed via /auth/2fa/enable" }

  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Confirm setup and turn 2FA on for the authenticated merchant
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: "6-digit TOTP code from the authenticator app" }
      responses:
        "200": { description: 2FA enabled, includes backup codes }

  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Turn 2FA off for the authenticated merchant
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, token]
              properties:
                password: { type: string }
                token: { type: string, description: "6-digit TOTP code, confirms the request" }
      responses:
        "200": { description: 2FA disabled }

  /merchant/me:
    get:
      tags: [Merchant]
      summary: Get the authenticated merchant's profile
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200": { description: Merchant profile }

  /merchant/webhook-url:
    patch:
      tags: [Merchant]
      summary: Set the URL SwiftPay should POST webhook notifications to
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200": { description: Updated }

  /merchant/regenerate-key:
    post:
      tags: [Merchant]
      summary: Rotate the merchant's API secret key
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200": { description: New key issued }

  /customers:
    post:
      tags: [Customers]
      summary: Create a customer
      security: [{ ApiKeyAuth: [] }]
      responses:
        "201": { description: Customer created }
    get:
      tags: [Customers]
      summary: List the merchant's customers
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200": { description: Customers }

  /virtual-accounts:
    post:
      tags: [Virtual Accounts]
      summary: Assign a pooled virtual account to a customer
      security: [{ ApiKeyAuth: [] }]
      responses:
        "201": { description: Account assigned }

  /virtual-accounts/{accountNumber}:
    get:
      tags: [Virtual Accounts]
      summary: Fetch a virtual account
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: accountNumber
          required: true
          schema: { type: string }
      responses:
        "200": { description: Account }

  /virtual-accounts/{accountNumber}/deactivate:
    post:
      tags: [Virtual Accounts]
      summary: Deactivate a virtual account, releasing it back to the pool
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: accountNumber
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deactivated }

  /admin/provision-pool:
    get:
      tags: [Admin]
      summary: Provision pooled accounts from a bank partner (operator-only)
      security: [{ AdminKeyAuth: [] }]
      parameters:
        - in: query
          name: bankSlug
          schema: { type: string, default: rexxpay-bank }
        - in: query
          name: count
          schema: { type: integer, default: 20, maximum: 500 }
      responses:
        "200": { description: Provisioned }

  /admin/pool-status:
    get:
      tags: [Admin]
      summary: Check pool health across bank partners (operator-only)
      security: [{ AdminKeyAuth: [] }]
      responses:
        "200": { description: Pool status by bank }

  /wallet:
    get:
      tags: [Wallet]
      summary: Get a wallet by currency (defaults to NGN)
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: query
          name: currency
          schema: { type: string, example: NGN }
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/Wallet" }

  /wallet/all:
    get:
      tags: [Wallet]
      summary: List every currency wallet the merchant holds
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: Wallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Wallet" }

  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions for the authenticated merchant
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }

  /payouts:
    post:
      tags: [Payouts]
      summary: Request a payout to a bank account
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, destinationBankCode, destinationAccountNumber, destinationAccountName]
              properties:
                amount: { type: integer, description: "Minor units" }
                currency: { type: string, example: NGN }
                recipientCode: { type: string }
                destinationBankCode: { type: string }
                destinationAccountNumber: { type: string }
                destinationAccountName: { type: string }
      responses:
        "201":
          description: Payout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/Payout" }
        "400":
          description: Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [Payouts]
      summary: List payouts
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Payout" }

  /payouts/bulk:
    post:
      tags: [Payouts]
      summary: Request up to 100 payouts in one call
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                currency: { type: string, example: NGN }
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      amount: { type: integer }
                      recipientCode: { type: string }
      responses:
        "201":
          description: Bulk payout accepted

  /recipients:
    post:
      tags: [Recipients]
      summary: Save a payout destination for reuse
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, bankCode, accountNumber, accountName]
              properties:
                label: { type: string, description: "Merchant's own name for this recipient, e.g. \"Jane - Payroll\"" }
                bankCode: { type: string }
                accountNumber: { type: string }
                accountName: { type: string }
      responses:
        "201":
          description: Recipient created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/Recipient" }
    get:
      tags: [Recipients]
      summary: List saved recipients
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: Recipients
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Recipient" }

  /recipients/{id}:
    get:
      tags: [Recipients]
      summary: Get a single recipient
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recipient
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/Recipient" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Recipients]
      summary: Deactivate a recipient
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recipient deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/Recipient" }

  /subaccounts:
    post:
      tags: [Subaccounts]
      summary: "Create a subaccount (split-payment sub-merchant)"
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, settlementBankCode, settlementAccountNumber, settlementAccountName]
              properties:
                businessName: { type: string }
                settlementBankCode: { type: string }
                settlementAccountNumber: { type: string }
                settlementAccountName: { type: string }
                defaultSplitPercentage:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: "Used at checkout time when no explicit splitPercentage is given"
      responses:
        "201":
          description: Subaccount created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/Subaccount" }
    get:
      tags: [Subaccounts]
      summary: List subaccounts
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: Subaccounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Subaccount" }

  /subaccounts/{id}:
    get:
      tags: [Subaccounts]
      summary: Get a single subaccount, including its current settleable balance
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Subaccount, with a `balance` field (minor units) added from the ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data: { $ref: "#/components/schemas/Subaccount" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /subaccounts/{id}/settle:
    post:
      tags: [Subaccounts]
      summary: Settle a subaccount's accrued ledger balance out to its bank account
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
