<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pay with SwiftPay</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --sky: #0ea5e9;
    --sky-dark: #0284c7;
    --sky-light: #e0f2fe;
    --sky-lighter: #f0f9ff;
    --ink: #0f2133;
    --ink-dim: #64748b;
    --line: #e2e8f0;
    --white: #ffffff;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
      180deg,
      var(--sky-lighter) 0%,
      #eaf6ff 100%
    );
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .pay-shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .pay-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 15px;
    color: var(--sky-dark);
  }

  .pay-brand .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--sky);
    box-shadow: 0 0 0 4px var(--sky-light);
  }

  .pay-card {
    width: 100%;
    max-width: 400px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px;
    text-align: center;
    box-shadow:
      0 10px 40px -12px rgba(14, 165, 233, 0.25),
      0 2px 8px rgba(15, 33, 51, 0.04);
  }

  .section-label {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .pay-amount {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 800;
    color: var(--ink);
    margin: 4px 0 24px;
  }

  .acct-box {
    background: var(--sky-lighter);
    border: 1px dashed var(--sky);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .acct-box .bank {
    color: var(--sky-dark);
    font-size: 13px;
    font-weight: 600;
  }

  .acct-box .num {
    font-family: var(--mono);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin: 6px 0;
    color: var(--ink);
  }

  .copy-hint {
    font-size: 11.5px;
    color: var(--ink-dim);
  }

  .status-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 20px;
  }

  .spinner {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--sky-light);
    border-top-color: var(--sky);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .success-check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--green-bg);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .pay-footer {
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .pay-footer svg {
    width: 13px;
    height: 13px;
    flex: none;
  }

  .test-banner {
    display: none;
    background: #fef9c3;
    border: 1px solid #eab308;
    color: #854d0e;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-align: center;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 16px;
  }

  .simulate-btn {
    display: none;
    width: 100%;
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--ink);
    color: var(--white);
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .simulate-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .simulate-hint {
    display: none;
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--ink-dim);
  }
</style>
</head>

<body>

<div class="pay-shell">

  <div class="pay-brand">
    <span class="dot"></span>
    SwiftPay
  </div>

  <div class="pay-card" id="payCard">

    <div class="test-banner" id="testBanner">
      Test mode — no real money moves
    </div>

    <div class="section-label">
      Pay via bank transfer
    </div>

    <div class="pay-amount" id="payAmount">
      —
    </div>

    <div class="acct-box" id="acctBox">

      <div class="bank" id="bankName">
        Loading account…
      </div>

      <div class="num" id="acctNumber">
        —
      </div>

      <div class="copy-hint" id="copyHint">
        Tap to copy account number
      </div>

    </div>

    <div class="status-line" id="statusLine">
      <span class="spinner"></span>
      <span id="statusText">
        Waiting for your transfer…
      </span>
    </div>

    <button class="simulate-btn" id="simulateBtn" type="button">
      Simulate bank transfer
    </button>

    <div class="simulate-hint" id="simulateHint">
      This is a sandbox checkout, so no real transfer will happen.
      Use the button above to fake one for testing.
    </div>

  </div>

  <div class="pay-footer">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <rect x="3" y="11" width="18" height="10" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>

    Secured by SwiftPay

  </div>

</div>


<script src="/js/pay.js"></script>

</body>
</html>
