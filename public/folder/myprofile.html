<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my profile</title>
  <link rel="icon" type="image/png" href="file_0000000085e0720a9dd1cf99bf9264cc.png">
  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <!-- Apple devices -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <!-- PWA / Android -->
  <link rel="manifest" href="assets/icons/manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Fonts / CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background: #f7f8fc;
    color: #222;
  }
  a { text-decoration: none; color: #333;}
  a:hover{color: blue;}

  /* NAVBAR */
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    height: 60px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-weight: bold;
    font-size: clamp(20px, 2vw, 28px);
    background: linear-gradient(90deg, #3b82f6, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: transparent;
  }

  /* Hamburger */
  .menu-icon {
    display: none;
    cursor: pointer;
    flex-direction: column;
    gap: 5px;
  }
  .menu-icon span {
    height: 3px;
    width: 25px;
    background: #333;
    border-radius: 2px;
    transition: 0.3s;
  }
  .menu-icon.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  .menu-icon.active span:nth-child(2) { opacity: 0; }
  .menu-icon.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  /* DASHBOARD + SIDEBAR */
  .dashboard {
    display: flex;
    min-height: calc(100vh - 60px);
  }
  .sidebar {
    width: 220px;
    background: #fff;
    padding: 20px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    transition: transform 0.3s ease;
  }
  .sidebar h2 {
    font-size: 1rem;
    margin-bottom: 15px;
    color: #555;
  }
  .sidebar a {
    display: block;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 6px;
    color: #333;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .sidebar a:hover {
    background: #e3e8ff;
    color: #3b82f6;
  }

  /* PROFILE PICTURE */
  .profile-pic-container {
    width: clamp(70px, 50%, 120px);
    aspect-ratio: 1 / 1;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid #3b82f6;
  }
  .profile-pic-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* CONTENT */
  .content {
    flex: 1;
    padding: 30px;
  }
  .content h1 { text-align: center; color: #3b82f6; margin-bottom: 25px; }
  .profile-detail { margin-bottom: 20px; font-size: 1rem; }
  .profile-detail strong { display:inline-block; width:120px; }
  .email-status { font-weight:600; }

  /* RESPONSIVE */
  @media (max-width:900px){
    .menu-icon{display:flex;}
    .sidebar {
      position: fixed;
      height: 100%;
      top: 0;
      left: -260px;
      z-index:200;
    }
    .sidebar.active { left:0; }
    .dashboard { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo"><a href="../index.html">SwiftPay</a></div>
  <div class="menu-icon" id="menuIcon"><span></span><span></span><span></span></div>
</div>

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="profile-pic-container">
      <img id="sidebarProfilePic" src="https://via.placeholder.com/100" alt="Profile Picture">
    </div>
    <a href="dashboard.html">Back to dashboard</a>
    <a href="/onboarding.html?tab=login" id="logoutBtn" style="color:#ef4444;">Logout</a>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <h1>My Profile</h1>
    <div class="profile-pic-container">
      <img id="mainProfilePic" src="https://via.placeholder.com/100" alt="Profile Picture">
    </div>
    <div class="profile-detail"><strong>Full Name:</strong> <span id="fullName">Loading...</span></div>
    <div class="profile-detail">
      <strong>Email:</strong> <span id="email">Loading...</span> 
      <span id="emailBadge" class="email-status"></span>
    </div>
    <div class="profile-detail"><strong>Password:</strong> <span id="password">******</span></div>
    <a href="profileedit.html">Edit Profile</a>
  </div>

</div>

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
$(document).ready(function(){

  // Hamburger toggle
  $('#menuIcon').click(function(e){
    e.stopPropagation();
    $('#sidebar').toggleClass('active');
    $(this).toggleClass('active');
  });

  // Close sidebar on click outside
  $(document).click(function(e){
    if($(window).width() <= 900 && $('#sidebar').hasClass('active')){
      if(!$(e.target).is('#menuIcon') && !$(e.target).closest('#menuIcon').length){
        $('#sidebar').removeClass('active');
        $('#menuIcon').removeClass('active');
      }
    }
  });

  // Sidebar links click closes sidebar on mobile
  $('#sidebar a').click(function(){
    if($(window).width() <= 900){
      $('#sidebar').removeClass('active');
      $('#menuIcon').removeClass('active');
    }
  });

  // ===================== Load profile data =====================
  const fullname = localStorage.getItem('fullname') || 'Not set';
  const email = localStorage.getItem('email') || 'Not set';
  const profilePic = localStorage.getItem('profilePic');
  const emailVerified = localStorage.getItem('emailVerified');

  $('#fullName').text(fullname);
  $('#email').text(email);

  // Update both profile pics
  if(profilePic){
    $('#sidebarProfilePic').attr('src', profilePic);
    $('#mainProfilePic').attr('src', profilePic);
  }

 
  // ===================== Email badge + verify button =====================
function updateEmailStatus() {
    const emailVerified = localStorage.getItem('emailVerified');
    const badgeContainer = $('#emailBadge');
    badgeContainer.empty(); // clear previous content

    if(emailVerified === 'true'){
        badgeContainer.text('Verified ✅').css({color:'green', fontWeight:'600'});
    } else {
        // Unverified + button
        const badge = $('<span>').text('Unverified ❌').css({color:'#ef4444', fontWeight:'600', marginRight:'10px'});
        const verifyBtn = $('<button>').text('Click to verify').css({
            padding:'2px 6px',
            fontSize:'0.8rem',
            cursor:'pointer',
            border:'1px solid #3b82f6',
            borderRadius:'4px',
            background:'#fff',
            color:'#3b82f6'
        });

        // Add click handler
        verifyBtn.click(function(){
            localStorage.setItem('emailVerified', 'true');
            updateEmailStatus(); // update badge
            alert('Email verified! ✅');
        });

        badgeContainer.append(badge, verifyBtn);
    }
}

// Run on page load
updateEmailStatus();

  // Logout
  $('#logoutBtn').click(function(){
    localStorage.clear();
    window.location.href = '/onboarding.html?tab=login';
  });

});
</script>
</body>
</html>
